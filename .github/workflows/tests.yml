name: Invoice API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          INVOICE_API_KEY: invoice-demo-key-2026
        run: pytest -q

      - name: Build Docker image
        run: docker build -t invoice-payment-automation .

  database-lifecycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: invoice_lifecycle_test
          POSTGRES_USER: invoice_test
          POSTGRES_PASSWORD: test-only-invoice-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoice_test -d invoice_lifecycle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Test payment state, reminder ledger, concurrency and retry recovery
        env:
          INVOICE_API_KEY: invoice-demo-key-2026
          INVOICE_TEST_DATABASE_URL: postgresql://invoice_test:test-only-invoice-password@127.0.0.1:5432/invoice_lifecycle_test
        run: python -m pytest -q test_invoice_database.py
